services:
  - type: web
    name: clario
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MODE
        value: sandbox
      - key: HOST
        value: 0.0.0.0
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: CLARIO_PASSPHRASE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: CLARIO_CONTACTS_JSON
        sync: false
      - key: CLARIO_DATA_DIR
        value: /var/data
    # The audit log is the payment record; without a disk it resets on redeploy.
    # Render disks need a paid instance type -- on the free plan, delete this block
    # and set CLARIO_DATA_DIR back to `data`, accepting that history resets.
    disk:
      name: clario-data
      mountPath: /var/data
      sizeGB: 1
